# VCOSTAEDU — exemplo de configuração para o Nginx (com o PHP-FPM).
#
# No Apache, os arquivos .htaccess fazem as rotas e negam as pastas que não respondem pela web. O Nginx não lê
# .htaccess: este arquivo faz o mesmo. Cada bloco diz de qual .htaccess veio. O guia curto: docs/IMPLANTACAO.md.
#
# Troque os três valores marcados com "TROQUE": o nome do site, a pasta do sistema e o endereço do PHP-FPM.
# O exemplo supõe o sistema na raiz do site (https://escola.exemplo.invalid/). Numa subpasta, ponha o nome dela na
# frente de cada endereço (ex.: /vcostaedu/painel/) e indique a subpasta em CAMINHO_BASE, na configuração.
#
# Depois de ligar: Manutenção → Verificações de segurança, item "Pastas protegidas" (cada pasta negada é pedida pela
# web e tem de recusar), e, para a lista completa, database/ferramentas/implantacao/varredura_exposicao.php.

upstream vcostaedu_php {
    server unix:/caminho/do/php-fpm.sock;    # TROQUE: o endereço do PHP-FPM (o soquete ou o endereço e a porta)
}

server {
    listen 443 ssl;
    http2 on;
    server_name escola.exemplo.invalid;      # TROQUE: o nome do site
    root /caminho/da/pasta/do/sistema;      # TROQUE: a pasta do sistema (a que tem index.php, painel/ e portal/)
    index index.php;

    # ssl_certificate     /caminho/do/certificado.pem;   o certificado da instituição
    # ssl_certificate_key /caminho/da/chave-do-certificado;

    autoindex off;                           # Options -Indexes (todos os .htaccess)
    client_max_body_size 20m;                # as planilhas de importação e as fotos enviadas pelas telas

    # ------------------------------------------------------------------------------------------------------------
    # 1. Negado em qualquer pasta (.htaccess da raiz)
    # ------------------------------------------------------------------------------------------------------------
    location ~* /\.git(/|$) { return 404; }
    # nada roda como programa dentro de assets/ (as fotos enviadas pelas telas ficam lá)
    location ~* /assets/.*\.(php[0-9]?|phtml|phar|pht|phps|cgi|pl|py)$ { return 404; }
    # documentação, scripts, dependências e arquivos de configuração
    location ~* (\.(md|sql|log|bak|sh|lock|swp|dist|ya?ml|ini|env|tsv)|/(composer|package|package-lock|bower)\.json|/\.git[^/]*|/\.htaccess)$ { deny all; }

    # ------------------------------------------------------------------------------------------------------------
    # 2. As pastas que não respondem pela web ("Require all denied" e [F])
    # ------------------------------------------------------------------------------------------------------------
    location ^~ /bin/ { deny all; }                       # bin/.htaccess
    location ^~ /core/ { deny all; }                      # core/.htaccess
    location ^~ /database/ { deny all; }                  # database/.htaccess
    location ^~ /docs/api/ { deny all; }                  # docs/api/.htaccess (a especificação sai pela tela Integrações)
    location ^~ /docs/nginx/ { deny all; }                # docs/nginx/.htaccess (este arquivo)
    location ^~ /tests/ { deny all; }                     # tests/.htaccess
    location ^~ /storage/ { deny all; }                   # storage/.htaccess (os arquivos privados, se a pasta ficar aqui)
    location ^~ /painel/assets/docs/alunos/ { deny all; } # painel/.htaccess
    location ~ ^/(painel|portal)/(app|core|vendor)(/|$) { deny all; }   # painel/.htaccess e portal/.htaccess
    # os sites de exemplo (exemplos/*/.htaccess): a configuração com a chave, o código comum e o LEIA-ME
    location ~ ^/exemplos/(curso-livre|portal-matricula)/(config\.local\.php|config\.exemplo\.php|lib\.php|LEIA-ME\.md|FONTES\.md)$ { deny all; }
    location ~ ^/exemplos/curso-livre/dados(/|$) { return 404; }

    # ------------------------------------------------------------------------------------------------------------
    # 3. As rotas (RewriteRule … index.php)
    # ------------------------------------------------------------------------------------------------------------
    # o instalador (instalar/.htaccess): todo endereço da pasta vai para o index.php dele (instalado, ele recusa)
    location ^~ /instalar/ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/instalar/index.php;
        fastcgi_param SCRIPT_NAME /instalar/index.php;
        fastcgi_param HTTPS $https if_not_empty;
        fastcgi_pass vcostaedu_php;
    }
    # a interface de integração (api/.htaccess): tudo que não é arquivo vai para api/index.php; o cabeçalho
    # Authorization chega ao PHP (o Nginx passa todos os cabeçalhos como HTTP_*)
    location /api/ { try_files $uri @vcostaedu_api; }
    location @vcostaedu_api { rewrite ^ /api/index.php last; }
    # o painel e o portal (painel/.htaccess, portal/.htaccess): o que não é arquivo nem pasta vai para index.php?url=
    location /painel/ { try_files $uri $uri/ @vcostaedu_painel; }
    location @vcostaedu_painel { rewrite ^/painel/(.+)$ /painel/index.php?url=$1 last; }
    location /portal/ { try_files $uri $uri/ @vcostaedu_portal; }
    location @vcostaedu_portal { rewrite ^/portal/(.+)$ /portal/index.php?url=$1 last; }
    # a raiz (.htaccess da raiz): a página de entrada e o endereço curto da verificação (/verificar/<código>)
    location / { try_files $uri $uri/ @vcostaedu_raiz; }
    location @vcostaedu_raiz { rewrite ^/(.+)$ /index.php?url=$1 last; }

    # ------------------------------------------------------------------------------------------------------------
    # 4. O PHP (depois das recusas: o Nginx usa a primeira expressão que casa, na ordem do arquivo)
    # ------------------------------------------------------------------------------------------------------------
    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS $https if_not_empty;
        fastcgi_pass vcostaedu_php;
    }
}

# O endereço sem HTTPS vai para o com HTTPS.
server {
    listen 80;
    server_name escola.exemplo.invalid;      # TROQUE: o mesmo nome do site
    return 301 https://$host$request_uri;
}
